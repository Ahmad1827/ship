[package]
name = "ships"
version = "0.2.0"
edition = "2021"
description = "Zero-config build, dependency harvester and single-file packager for native apps and indie games"
license = "MIT"
repository = "https://github.com/Ahmad1827/ship"
readme = "README.md"
keywords = ["packaging", "gamedev", "appimage", "mingw", "itch"]
categories = ["command-line-utilities", "development-tools::build-utils", "game-development"]
# Only what's needed to build; the unused assets/default_font.ttf stays out of the crate.
exclude = [".github/", "assets/"]

# The package is "ships" on crates.io (the name "ship" is taken), but the command stays `ship`.
[[bin]]
name = "ship"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
flate2 = "1.1.10"
goblin = "0.9"
lz4_flex = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ttf-parser = "0.25"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
