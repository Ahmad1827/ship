[package]
name = "ship"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
flate2 = "1.1.10"
goblin = "0.9"
lz4_flex = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ttf-parser = "0.25"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
